name: Publish class website

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the files
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Smoke-test every AULA game and difficulty
        run: |
          node --check games.js
          node tests/game-smoke.cjs
          node --check freeplay.js
          node --check arcade-progress.js
          node --check arcade-leaderboard.js
          node tests/arcade-smoke.cjs
      - name: List the class files on the website
        run: python3 .github/build_class_site.py
      - name: Check published game links and assets
        run: python3 tests/check_published_site.py
      - name: Upload the generated website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _class_site
      - name: Wait for any branch-based Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Repositories still using Deploy from a branch can publish both builds.
          # Let the generated site deploy last. Actions-only sites have no branch run.
          for attempt in {1..36}; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=50" \
              --jq '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")]')
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<< "$runs" >/dev/null; then
              exit 0
            fi
            if [[ $attempt -ge 5 && $runs == '[]' ]]; then
              exit 0
            fi
            sleep 5
          done
          echo 'The branch-based Pages deployment did not finish within three minutes.' >&2
          exit 1
      - name: Wait until exactly one Pages artifact is visible
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub's artifact API can lag behind a completed upload.
          # A clean new workflow run has exactly one github-pages archive.
          for attempt in {1..40}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [[ "$count" == "1" ]]; then
              echo "Pages archive ready"
              exit 0
            fi
            if [[ "$count" -gt 1 ]]; then
              echo "Multiple Pages artifacts in this run. Use a fresh workflow run." >&2
              exit 1
            fi
            sleep 3
          done
          echo "Timed out while waiting for the Pages artifact to appear." >&2
          exit 1
      - name: Publish the website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify actual public game URLs after deployment
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tests/check_live_site.py

